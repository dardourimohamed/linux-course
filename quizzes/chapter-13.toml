# Chapter 13 Quiz: Docker Containers

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What is the PRIMARY difference between containers and virtual machines?"
prompt.distractors = [
  "VMs are faster than containers",
  "Containers include full OS kernel, VMs share the host kernel",
  "VMs are for development, containers are for production only",
]
answer.answer = "Containers share the host kernel; VMs have their own kernel"
context = """
Containers share the host OS kernel and only package the application and dependencies — much lighter weight. VMs include a full guest OS kernel, making them heavier but more isolated. This is why containers start in seconds, VMs in minutes.
"""
id = "c13-q1-containers-vs-vms"

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What does the `-d` flag do in `docker run -d nginx`?"
prompt.distractors = [
  "Deletes the container after it exits",
  "Runs the container in debug mode",
  "Displays detailed logs",
]
answer.answer = "Runs the container in detached mode (background)"
context = """
`docker run -d` starts the container in the background (detached mode). Without `-d`, the container runs in the foreground, attaching your terminal to the container's output. Use `-d` for servers and daemons.
"""
id = "c13-q2-detached-mode"

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What is the difference between a Docker image and a container?"
prompt.distractors = [
  "Images run, images are stored; containers are templates",
  "Images are for Windows, containers are for Linux",
  "They are the same thing with different names",
]
answer.answer = "Image is a template; container is a running instance of an image"
context = """
Think of images as classes and containers as objects (instances). An image is a read-only template with layers. A container is a runnable instance created from an image. You can create many containers from one image.
"""
id = "c13-q3-image-vs-container"

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What does `-p 8080:80` do in `docker run -p 8080:80 nginx`?"
prompt.distractors = [
  "Maps container port 8080 to host port 80",
  "Opens ports 8080 and 80 on both host and container",
  "Blocks port 80 on the host",
]
answer.answer = "Maps host port 8080 to container port 80"
context = """
Port mapping syntax: `-p host_port:container_port`. `-p 8080:80` means traffic to host:8080 forwards to container:80. This makes the container's internal port accessible from outside.
"""
id = "c13-q4-port-mapping"

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What is the purpose of a Dockerfile?"
prompt.distractors = [
  "To document container runtime logs",
  "To configure Docker daemon settings",
  "To list all installed Docker images",
]
answer.answer = "A script that defines how to build a Docker image"
context = """
A Dockerfile contains instructions for building an image. Each instruction (FROM, RUN, COPY, CMD, etc.) creates a layer. `docker build -t myimage .` reads the Dockerfile and builds the image according to its instructions.
"""
id = "c13-q5-dockerfile"

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What does `FROM ubuntu:22.04` do in a Dockerfile?"
prompt.distractors = [
  "Copies files from Ubuntu 22.04 to the container",
  "Installs Ubuntu packages",
  "Creates a new Ubuntu virtual machine",
]
answer.answer = "Sets the base image for subsequent instructions"
context = """
`FROM` sets the base image — the starting point for your image. All subsequent instructions build on top of this base. You can use official images (ubuntu, nginx, python) or your own custom base images.
"""
id = "c13-q6-from-instruction"

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What is the difference between `CMD` and `ENTRYPOINT` in a Dockerfile?"
prompt.distractors = [
  "CMD is for Windows containers, ENTRYPOINT for Linux",
  "CMD runs at build time, ENTRYPOINT runs at runtime",
  "They are identical and interchangeable",
]
answer.answer = "ENTRYPOINT defines the main executable; CMD provides default arguments"
context = """
`ENTRYPOINT` configures the container's main command — it always runs. `CMD` provides default arguments to ENTRYPOINT. You can override CMD at runtime (docker run image args) but not ENTRYPOINT easily.
"""
id = "c13-q7-cmd-vs-entrypoint"

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What does `docker exec -it container bash` do?"
prompt.distractors = [
  "Builds a new image from the container",
  "Stops the container and removes it",
  "Shows container logs",
]
answer.answer = "Opens an interactive bash shell inside the running container"
context = """
`docker exec` runs a command in a running container. `-it` allocates a pseudo-TTY and keeps STDIN open, making it interactive. Combined with `bash`, you get an interactive shell inside the container for debugging.
"""
id = "c13-q8-exec-it"

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What is a Docker volume?"
prompt.distractors = [
  "A backup of the entire Docker filesystem",
  "A compressed Docker image format",
  "A network connection between containers",
]
answer.answer = "Persistent storage that survives container deletion"
context = """
Containers are ephemeral — when deleted, their data is gone. Volumes provide persistent storage outside the container's filesystem. Named volumes can be attached to any container, preserving data across container lifecycle.
"""
id = "c13-q9-volumes"

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What is the purpose of Docker Compose?"
prompt.distractors = [
  "To compress Docker images for faster downloads",
  "To automatically install Docker on any system",
  "To convert Docker containers to virtual machines",
]
answer.answer = "To define and run multi-container applications"
context = """
Docker Compose uses YAML to define multiple containers, networks, and volumes. `docker compose up -d` starts all services. Essential for applications with web server + database + cache, etc.
"""
id = "c13-q10-compose"

[[questions]]
type = "ShortAnswer"
prompt.prompt = "What command lists all running containers?"
answer.answer = "docker ps"
context = """
`docker ps` shows running containers. Add `-a` to see all containers including stopped ones. Output includes container ID, image, command, created time, status, ports, and names.
"""
id = "c13-sa1-docker-ps"

[[questions]]
type = "ShortAnswer"
prompt.prompt = "What instruction copies files from the host into the Docker image during build?"
answer.answer = "COPY"
context = """
`COPY src dest` copies files from the host into the image. Use `ADD` for URLs and auto-extraction of tar files, but `COPY` is preferred for simple file copying as it's more transparent.
"""
id = "c13-sa2-copy"
